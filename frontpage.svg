<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#f7f3ea" />

  <!-- Masthead -->
  <g font-family="Georgia, serif" fill="#111111" text-anchor="middle">
    <text x="512" y="80" font-size="46" font-weight="bold" letter-spacing="4">THE WORLD IN ONE DAY</text>
    <text x="512" y="110" font-family="Arial, sans-serif" font-size="16" letter-spacing="1">Tuesday, 24 November 2026</text>
  </g>
  <line x1="40" y1="130" x2="984" y2="130" stroke="#111111" stroke-width="3" />
  <line x1="40" y1="135" x2="984" y2="135" stroke="#111111" stroke-width="1" />

  <!-- Lead Story -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" letter-spacing="1">
    <text x="40" y="165">EUROPE / MIDDLE EAST</text>
  </g>
  <g font-family="Georgia, serif" font-weight="bold" fill="#111111">
    <text x="40" y="210" font-size="58" textLength="944">WAR IN UKRAINE ESCALATES:</text>
    <text x="40" y="275" font-size="58" textLength="944">KYIV HIT, RUSSIAN SHIP ABLAZE,</text>
    <text x="40" y="340" font-size="58" textLength="944">CORVETTE DESTROYED IN LIBYA</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#111111">
    <text x="40" y="390">Massive drone and missile strikes rocked the Kyiv region,</text>
    <text x="40" y="410">leaving several people missing. The cargo ship Sparta II</text>
    <text x="40" y="430">caught fire in the Gulf of Finland after a drone attack,</text>
    <text x="40" y="450">and a Russian Navy corvette was destroyed by explosion and fire</text>
    <text x="40" y="470">at Benghazi port, Libya.</text>
  </g>

  <!-- Lead Illustration (shifted down 40px so it no longer covers the third headline line) -->
  <g>
    <!-- Sky -->
    <rect x="620" y="370" width="364" height="140" fill="#1e293b" />
    <!-- Sea -->
    <path d="M 620 470 L 984 470 L 984 510 L 620 510 Z" fill="#0f172a" />
    <!-- Explosion Glow -->
    <circle cx="760" cy="435" r="55" fill="#b91c1c" opacity="0.2" />
    <circle cx="760" cy="435" r="45" fill="#b91c1c" opacity="0.4" />
    <!-- Flames -->
    <path d="M 720 435 Q 760 395 800 435 Q 760 475 720 435 Z" fill="#facc15" opacity="0.8" />
    <!-- Explosion Core -->
    <circle cx="760" cy="435" r="35" fill="#b91c1c" />
    <circle cx="760" cy="435" r="20" fill="#ea580c" />
    <circle cx="760" cy="435" r="10" fill="#facc15" />
    <!-- Sparks -->
    <circle cx="730" cy="415" r="4" fill="#facc15" />
    <circle cx="790" cy="405" r="3" fill="#facc15" />
    <circle cx="780" cy="465" r="5" fill="#ea580c" />
    <!-- Ship Rubble Left -->
    <rect x="670" y="470" width="30" height="15" fill="#111111" />
    <polygon points="700,470 710,460 720,470" fill="#111111" />
    <!-- Ship Rubble Right -->
    <rect x="860" y="480" width="25" height="10" fill="#111111" />
    <polygon points="885,480 890,470 895,480" fill="#111111" />
  </g>

  <!-- Rule after Lead Story -->
  <line x1="40" y1="520" x2="984" y2="520" stroke="#111111" stroke-width="2" />

  <!-- 2-Column Grid Layout -->
  <!-- Vertical Rule -->
  <line x1="512" y1="540" x2="512" y2="1000" stroke="#111111" stroke-width="1" />

  <!-- Row 1: Stories 2 & 3 -->
  <!-- Story 2 - Indonesia Factory Fire -->
  <g>
    <text x="40" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" letter-spacing="1">ASIA</text>
    <text x="40" y="585" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">Indonesia Factory Fire</text>
    <text x="40" y="610" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">Kills 24</text>
    <text x="40" y="635" font-family="Arial, sans-serif" font-size="16" fill="#111111">Rescuers search for missing workers</text>
    <text x="40" y="655" font-family="Arial, sans-serif" font-size="16" fill="#111111">after a blaze at a candy factory in</text>
    <text x="40" y="675" font-family="Arial, sans-serif" font-size="16" fill="#111111">Banten province.</text>
    <!-- Illustration -->
    <g transform="translate(300, 650)">
      <rect x="0" y="15" width="40" height="20" fill="#64748b" />
      <polygon points="0,15 10,5 20,15" fill="#334155" />
      <rect x="15" y="0" width="8" height="15" fill="#334155" />
      <circle cx="19" cy="-5" r="6" fill="#cbd5e1" />
      <circle cx="25" cy="-12" r="8" fill="#cbd5e1" />
      <polygon points="5,15 10,8 15,15" fill="#ea580c" />
      <polygon points="10,15 15,10 20,15" fill="#facc15" />
      <!-- Fire Truck -->
      <rect x="50" y="25" width="20" height="10" fill="#b91c1c" />
      <rect x="55" y="22" width="8" height="3" fill="#b91c1c" />
      <circle cx="55" cy="35" r="3" fill="#111111" />
      <circle cx="65" cy="35" r="3" fill="#111111" />
    </g>
  </g>

  <!-- Story 3 - COP31 -->
  <g>
    <text x="532" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" letter-spacing="1">CLIMATE</text>
    <text x="532" y="585" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">COP31 Ends Without</text>
    <text x="532" y="610" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">Fossil Fuel Deal</text>
    <text x="532" y="635" font-family="Arial, sans-serif" font-size="16" fill="#111111">Nations remained divided in Antalya,</text>
    <text x="532" y="655" font-family="Arial, sans-serif" font-size="16" fill="#111111">Turkiye, failing to reach a consensus</text>
    <text x="532" y="675" font-family="Arial, sans-serif" font-size="16" fill="#111111">on phasing out oil and gas.</text>
    <!-- Illustration -->
    <g transform="translate(810, 650)">
      <circle cx="20" cy="20" r="18" fill="#38bdf8" />
      <path d="M 10 20 Q 20 10 30 20 Q 20 30 10 20 Z" fill="#4ade80" />
      <rect x="40" y="8" width="4" height="14" fill="#f8fafc" stroke="#111111" stroke-width="1" />
      <circle cx="42" cy="25" r="4" fill="#b91c1c" />
      <text x="5" y="5" font-family="Arial, sans-serif" font-size="8" fill="#111111">CO2</text>
    </g>
  </g>

  <!-- Row 2: Stories 4 & 5 -->
  <line x1="40" y1="710" x2="984" y2="710" stroke="#111111" stroke-width="1" />

  <!-- Story 4 - Trump / North Korea -->
  <g>
    <text x="40" y="740" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" letter-spacing="1">WASHINGTON</text>
    <text x="40" y="765" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">Pyongyang Ignores</text>
    <text x="40" y="790" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">Trump's Outreach</text>
    <text x="40" y="815" font-family="Arial, sans-serif" font-size="16" fill="#111111">Attempts to re-establish dialogue with</text>
    <text x="40" y="835" font-family="Arial, sans-serif" font-size="16" fill="#111111">Kim Jong Un have been rejected as</text>
    <text x="40" y="855" font-family="Arial, sans-serif" font-size="16" fill="#111111">nuclear expansion continues.</text>
    <!-- Illustration -->
    <g transform="translate(300, 840)">
      <polygon points="0,15 15,5 30,15 15,25" fill="#111111" />
      <circle cx="35" cy="15" r="5" fill="#cbd5e1" />
      <circle cx="42" cy="10" r="7" fill="#cbd5e1" />
      <circle cx="55" cy="15" r="10" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="2,2" />
      <text x="-10" y="35" font-family="Arial, sans-serif" font-size="8" fill="#111111">PYONGYANG</text>
    </g>
  </g>

  <!-- Story 5 - Sports -->
  <g>
    <text x="532" y="740" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" letter-spacing="1">SPORT</text>
    <text x="532" y="765" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">Verstappen Wins Vegas GP;</text>
    <text x="532" y="790" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">Alcaraz Takes ATP Finals</text>
    <text x="532" y="815" font-family="Arial, sans-serif" font-size="16" fill="#111111">The Red Bull driver dominated the Las</text>
    <text x="532" y="835" font-family="Arial, sans-serif" font-size="16" fill="#111111">Vegas Grand Prix, while Alcaraz beat</text>
    <text x="532" y="855" font-family="Arial, sans-serif" font-size="16" fill="#111111">Zverev for his maiden ATP Finals title.</text>
    <!-- Illustration -->
    <g transform="translate(810, 840)">
      <path d="M 20 10 C 20 0 35 0 35 10" fill="#facc15" stroke="#111111" stroke-width="1" />
      <rect x="22" y="10" width="11" height="10" fill="#facc15" />
      <path d="M 20 12 Q 15 8 20 5" fill="none" stroke="#111111" stroke-width="1" />
      <path d="M 35 12 Q 40 8 35 5" fill="none" stroke="#111111" stroke-width="1" />
      <rect x="0" y="25" width="12" height="10" fill="#111111" />
      <rect x="0" y="25" width="6" height="5" fill="#f8fafc" />
      <rect x="6" y="30" width="6" height="5" fill="#f8fafc" />
    </g>
  </g>

  <!-- Row 3: Story 6 & In Brief -->
  <line x1="40" y1="860" x2="984" y2="860" stroke="#111111" stroke-width="1" />

  <!-- Story 6 - Science -->
  <g>
    <text x="40" y="890" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" letter-spacing="1">SCIENCE</text>
    <text x="40" y="915" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">BepiColombo Enters</text>
    <text x="40" y="940" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">Mercury Orbit</text>
    <text x="40" y="965" font-family="Arial, sans-serif" font-size="16" fill="#111111">The ESA/JAXA probe reached Mercury</text>
    <text x="40" y="985" font-family="Arial, sans-serif" font-size="16" fill="#111111">on Nov 21, though operations did not</text>
    <text x="40" y="1005" font-family="Arial, sans-serif" font-size="16" fill="#111111">go exactly as planned.</text>
    <!-- Illustration -->
    <g transform="translate(300, 920)">
      <circle cx="15" cy="15" r="12" fill="#94a3b8" />
      <circle cx="12" cy="12" r="3" fill="#64748b" />
      <circle cx="18" cy="18" r="2" fill="#64748b" />
      <rect x="30" y="10" width="12" height="12" fill="#111111" />
      <rect x="25" y="12" width="5" height="5" fill="#38bdf8" />
      <rect x="42" y="12" width="5" height="5" fill="#38bdf8" />
      <ellipse cx="15" cy="15" rx="25" ry="8" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="2,2" transform="rotate(-15 15 15)" />
    </g>
  </g>

  <!-- In Brief / World Markets -->
  <g>
    <text x="532" y="890" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" letter-spacing="1">IN BRIEF</text>
    <text x="532" y="915" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#111111">World Markets</text>
    <text x="532" y="940" font-family="Arial, sans-serif" font-size="16" fill="#111111">Stocks steady amid geopolitical</text>
    <text x="532" y="960" font-family="Arial, sans-serif" font-size="16" fill="#111111">tension. Oil rises on supply fears.</text>
    <!-- Illustration -->
    <g transform="translate(810, 920)">
      <rect x="0" y="15" width="8" height="10" fill="#111111" />
      <rect x="12" y="8" width="8" height="17" fill="#111111" />
      <rect x="24" y="18" width="8" height="7" fill="#b91c1c" />
      <rect x="36" y="2" width="8" height="23" fill="#b91c1c" />
      <polyline points="0,20 12,13 36,7" fill="none" stroke="#b91c1c" stroke-width="2" />
    </g>
  </g>

  <!-- Final Rule -->
  <line x1="40" y1="1014" x2="984" y2="1014" stroke="#111111" stroke-width="2" />
</svg>
