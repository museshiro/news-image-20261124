<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Paper -->
  <rect width="1024" height="1024" fill="#f7f3ea" />

  <!-- Masthead -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#111111" text-anchor="middle">
    <text x="512" y="78" font-size="60" font-weight="bold" letter-spacing="2">THE WORLD IN ONE DAY</text>
    <text x="512" y="112" font-size="20">Tuesday, 24 November 2026</text>
  </g>
  <rect x="40" y="128" width="944" height="4" fill="#111111" />
  <rect x="40" y="136" width="944" height="1.5" fill="#111111" />

  <!-- Lead story -->
  <text x="40" y="168" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#b91c1c">EUROPE / MIDDLE EAST</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#111111">
    <text x="40" y="222">UKRAINE WAR ESCALATES:</text>
    <text x="40" y="282">KYIV HIT, SHIP ABLAZE,</text>
    <text x="40" y="342">CORVETTE DESTROYED IN LIBYA</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111111">
    <text x="40" y="388">Massive drone and missile strikes rocked the Kyiv</text>
    <text x="40" y="411">region, leaving several people missing. The Russian</text>
    <text x="40" y="434">cargo ship Sparta II caught fire in the Gulf of</text>
    <text x="40" y="457">Finland after a drone attack, and a Russian Navy</text>
    <text x="40" y="480">corvette was destroyed by explosion and fire at</text>
    <text x="40" y="503">Benghazi port, Libya.</text>
  </g>

  <!-- Lead illustration: explosion over a harbour -->
  <g>
    <rect x="540" y="365" width="444" height="90" fill="#1d3557" />
    <rect x="540" y="455" width="444" height="45" fill="#2f5d7d" />
    <polygon points="770,368 778,382 762,382" fill="#f59e0b" />
    <polygon points="826,420 810,412 810,428" fill="#f59e0b" />
    <polygon points="714,420 730,412 730,428" fill="#f59e0b" />
    <polygon points="770,478 778,462 762,462" fill="#f59e0b" />
    <circle cx="770" cy="420" r="50" fill="#d43d1a" opacity="0.5" />
    <circle cx="770" cy="420" r="36" fill="#f59e0b" />
    <circle cx="770" cy="420" r="23" fill="#fde047" />
    <circle cx="770" cy="420" r="11" fill="#fff7cc" />
    <circle cx="700" cy="390" r="4" fill="#fde047" />
    <circle cx="840" cy="395" r="4" fill="#fde047" />
    <circle cx="715" cy="455" r="3" fill="#fff7cc" />
    <circle cx="835" cy="455" r="3" fill="#fff7cc" />
    <polygon points="566,468 648,468 638,486 576,486" fill="#0f1f2e" />
    <rect x="596" y="450" width="10" height="18" fill="#0f1f2e" />
    <circle cx="601" cy="444" r="6" fill="#e8e2d4" opacity="0.85" />
    <circle cx="613" cy="436" r="8" fill="#e8e2d4" opacity="0.85" />
    <circle cx="627" cy="428" r="9" fill="#e8e2d4" opacity="0.85" />
  </g>

  <rect x="40" y="520" width="944" height="2" fill="#111111" />

  <!-- Grid dividers -->
  <rect x="511" y="540" width="1.5" height="440" fill="#111111" />
  <rect x="40" y="686" width="944" height="1" fill="#111111" />
  <rect x="40" y="840" width="944" height="1" fill="#111111" />

  <!-- Row 1, left: Asia -->
  <text x="40" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#b91c1c">ASIA</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#111111">
    <text x="40" y="584">Indonesia Factory Fire</text>
    <text x="40" y="616">Kills 24</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111">
    <text x="40" y="640">A blaze at a candy factory in Banten</text>
    <text x="40" y="659">province killed at least 24 people;</text>
    <text x="40" y="678">rescuers search for the missing.</text>
  </g>
  <g>
    <rect x="428" y="640" width="52" height="22" fill="#5b6b7a" />
    <rect x="436" y="622" width="10" height="20" fill="#3a4653" />
    <polygon points="452,640 458,626 464,640" fill="#d43d1a" />
    <circle cx="441" cy="616" r="5" fill="#c9c2b2" />
    <circle cx="447" cy="608" r="6" fill="#c9c2b2" />
  </g>

  <!-- Row 1, right: Climate -->
  <text x="532" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#b91c1c">CLIMATE</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#111111">
    <text x="532" y="584">COP31 Ends With No</text>
    <text x="532" y="616">Fossil Fuel Deal</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111">
    <text x="532" y="640">Nations stayed divided in Antalya,</text>
    <text x="532" y="659">Türkiye, and failed to agree on</text>
    <text x="532" y="678">phasing out oil and gas.</text>
  </g>
  <g>
    <circle cx="940" cy="640" r="22" fill="#3b82c4" />
    <ellipse cx="933" cy="634" rx="9" ry="6" fill="#4caf6d" />
    <ellipse cx="948" cy="648" rx="7" ry="5" fill="#4caf6d" />
    <ellipse cx="940" cy="640" rx="30" ry="10" fill="none" stroke="#b91c1c" stroke-width="2" transform="rotate(-18 940 640)" />
  </g>

  <!-- Row 2, left: Washington -->
  <text x="40" y="708" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#b91c1c">WASHINGTON</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#111111">
    <text x="40" y="738">Pyongyang Rebuffs</text>
    <text x="40" y="770">Trump's Outreach</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111">
    <text x="40" y="794">Attempts to revive talks with Kim</text>
    <text x="40" y="813">Jong Un were ignored as North</text>
    <text x="40" y="832">Korea expands its nuclear arsenal.</text>
  </g>
  <g>
    <rect x="424" y="756" width="34" height="22" rx="6" fill="#111111" />
    <rect x="452" y="772" width="34" height="22" rx="6" fill="none" stroke="#b91c1c" stroke-width="2.5" />
    <circle cx="434" cy="767" r="2.5" fill="#f7f3ea" />
    <circle cx="441" cy="767" r="2.5" fill="#f7f3ea" />
    <circle cx="448" cy="767" r="2.5" fill="#f7f3ea" />
  </g>

  <!-- Row 2, right: Sport -->
  <text x="532" y="708" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#b91c1c">SPORT</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#111111">
    <text x="532" y="738">Verstappen Wins Vegas GP</text>
    <text x="532" y="770">Alcaraz Takes ATP Finals</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111">
    <text x="532" y="794">The Red Bull driver won the Las</text>
    <text x="532" y="813">Vegas Grand Prix; Alcaraz beat</text>
    <text x="532" y="832">Zverev for his first ATP title.</text>
  </g>
  <g>
    <path d="M920,748 h36 v10 c0,14 -8,24 -18,24 s-18,-10 -18,-24 z" fill="#d4a017" />
    <rect x="934" y="782" width="8" height="10" fill="#d4a017" />
    <rect x="926" y="792" width="24" height="6" fill="#d4a017" />
  </g>

  <!-- Row 3, left: Science -->
  <text x="40" y="862" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#b91c1c">SCIENCE</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#111111">
    <text x="40" y="892">BepiColombo Enters</text>
    <text x="40" y="924">Mercury Orbit</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111">
    <text x="40" y="948">The ESA/JAXA probe reached Mercury</text>
    <text x="40" y="967">on 21 November, though operations</text>
    <text x="40" y="986">did not go exactly as planned.</text>
  </g>
  <g>
    <circle cx="452" cy="962" r="18" fill="#8a7f72" />
    <circle cx="446" cy="956" r="3" fill="#6e6459" />
    <circle cx="458" cy="968" r="2.5" fill="#6e6459" />
    <ellipse cx="452" cy="962" rx="30" ry="10" fill="none" stroke="#b91c1c" stroke-width="2" transform="rotate(-20 452 962)" />
    <rect x="472" y="944" width="9" height="9" fill="#111111" />
  </g>

  <!-- Row 3, right: In brief -->
  <text x="532" y="862" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#b91c1c">IN BRIEF</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#111111">
    <text x="532" y="892">World Markets</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111">
    <text x="532" y="948">Stocks steady amid geopolitical</text>
    <text x="532" y="967">tension. Oil rises on supply fears.</text>
  </g>
  <g>
    <rect x="918" y="968" width="12" height="22" fill="#111111" />
    <rect x="936" y="956" width="12" height="34" fill="#b91c1c" />
    <rect x="954" y="944" width="12" height="46" fill="#111111" />
  </g>

  <rect x="40" y="1002" width="944" height="2" fill="#111111" />
</svg>
